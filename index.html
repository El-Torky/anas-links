<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anas — Links</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --bg: #0b0b0d;
  --card: #141417;
  --muted: #a8a8a8;
  --accent: #7c5cff;
  --radius: 18px;
  --hover-shadow: rgba(124,92,255,0.25);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  background: linear-gradient(180deg,#070707 0%, #121214 100%);
  font-family: 'Inter', system-ui, Arial, sans-serif;
  color: #fff;
}

.shell { 
  width: 100%; 
  max-width: 500px; 
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 22px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.65);
  border: 1px solid rgba(255,255,255,0.04);
  animation: enter .6s ease forwards;
  opacity: 0;
  transform: translateY(20px);
}

@keyframes enter { 
  to { opacity:1; transform:none; } 
}

/* HEADER */
header {
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:12px;
  margin-bottom: 24px;
}

/* ===== Avatar Advanced ===== */
.avatar {
  position: relative;
  width:120px;
  height:120px;
  border-radius:50%;
  padding:4px;
  background: linear-gradient(135deg, #7c5cff, #5f3dff, #9d84ff);
  background-size: 300% 300%;
  animation: gradientMove 6s ease infinite;
  box-shadow: 0 0 40px rgba(124,92,255,0.25);
  transform: scale(.9);
  opacity: 0;
  animation: avatarEnter .8s ease forwards, gradientMove 6s ease infinite;
}

@keyframes avatarEnter {
  to {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.avatar img {
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  border:3px solid #141417;
  transition: transform .3s ease;
}

.avatar:hover img {
  transform: scale(1.07);
}

.name { 
  font-weight:700; 
  font-size:22px; 
}

.bio { 
  color: var(--muted); 
  font-size:14px; 
}

/* LINKS */
.links { 
  display:grid; 
  gap:14px; 
}

.btn {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:15px;
  border-radius:14px;
  background:linear-gradient(90deg, rgba(0,0,0,0.65), rgba(255,255,255,0.03));
  border:1px solid rgba(255,255,255,0.05);
  text-decoration:none;
  color:#fff;
  font-weight:600;
  font-size:15px;
  transition: all .18s ease;
  box-shadow: 0 6px 18px rgba(0,0,0,0.5);
}

.btn:hover { 
  transform: translateY(-4px);
  box-shadow: 0 10px 30px var(--hover-shadow);
}

.btn .icon { 
  font-size:18px; 
  opacity:0.9; 
}

@media (max-width:480px) {
  .card { padding:22px 18px; }
  .btn { padding:14px; font-size:14px; }
}
</style>
</head>

<body>
<div class="shell">
  <main class="card" role="main">

    <header>
      <div class="avatar">
        <img 
          src="./profile.webp" 
          alt="Anas Ahmed Profile Picture"
          loading="lazy"
          width="120"
          height="120"
        >
      </div>
      <div class="name">Anas Ahmed</div>
      <div class="bio">IT Support Specialist & Junior Data Analyst</div>
    </header>

    <section class="links">

      <!-- CV BUTTON -->
      <a class="btn" 
         href="https://drive.google.com/file/d/1F1aUNt9IkFNwStcSK0i32x3dnTmxwWRt/view?usp=sharing" 
         target="_blank">
        <span class="label">CV</span>
        <span class="icon"><i class="fas fa-file-alt"></i></span>
      </a>

      <a class="btn" href="https://www.linkedin.com/in/anas-ahmed-834255292/" target="_blank">
        <span class="label">LinkedIn</span>
        <span class="icon"><i class="fab fa-linkedin"></i></span>
      </a>

      <a class="btn" href="https://github.com/El-Torky" target="_blank">
        <span class="label">GitHub</span>
        <span class="icon"><i class="fab fa-github"></i></span>
      </a>

      <!-- Gmail BUTTON (يفتح Gmail تاب جديدة جاهز لكتابة رسالة) -->
<a class="btn" href="mailto:anasru1976ahmed@gmail.com" target="_blank">
  <span class="label">Gmail</span>
  <span class="icon"><i class="fas fa-envelope"></i></span>
</a>

      <a class="btn" href="https://wa.me/201220572439" target="_blank">
        <span class="label">WhatsApp</span>
        <span class="icon"><i class="fab fa-whatsapp"></i></span>
      </a>

    </section>

  </main>
</div>
</body>
</html>
